name: CI and Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit & provider tests
        run: |
          pytest -v

  deploy:
    name: Deploy to Raspberry Pi via SSH
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            
            # Traer últimos cambios desde main
            git fetch origin main
            git reset --hard origin/main
            
            # Actualizar dependencias del venv si hubiera cambios
            if [ -f requirements.txt ]; then
              .venv/bin/pip install -q -r requirements.txt
            fi
            
            # Reiniciar servicio systemd de usuario
            systemctl --user restart bot-precios.service
            
            # Verificar status
            systemctl --user is-active bot-precios.service
