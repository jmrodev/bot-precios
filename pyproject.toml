[project]
name = "bot-precios"
version = "1.0.0"
description = "ComparaPrecios AR: comparador de precios de supermercados de Tandil"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot>=22.0",
    "aiohttp>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
